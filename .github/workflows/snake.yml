name: Draw the contribution snake

# The snake on the profile README eats its way across the contribution graph.
# Once a day this redraws it from the latest graph, in GitHub's colours, which
# follow the visitor's light or dark mode on their own.
#
# The pictures are committed to main, in images/snake/, rather than kept on a
# branch of their own, so the repository stays a single branch. A day with no
# new contributions draws the same picture, and then nothing is committed.

on:
  schedule:
    - cron: "40 6 * * *" # daily, 06:40 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # GitHub's own palette, deliberately. Drawn with it, the picture carries
      # its own dark mode and switches with the page by itself. The pastel pair
      # tried first needed the README to pick a light or dark copy, GitHub did
      # not, and dark mode got pale squares on a dark page.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rishika1099
          outputs: |
            dist/snake.svg

      - name: Commit if it changed
        run: |
          mkdir -p images/snake
          cp dist/snake.svg images/snake/
          rm -f images/snake/snake-light.svg images/snake/snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/snake
          if git diff --cached --quiet; then
            echo "The snake is the same as yesterday's; nothing to commit."
            exit 0
          fi
          # [skip ci] and [skip netlify]: a new picture for the README is no
          # reason to rebuild the website
          git commit -m "Redraw the contribution snake [skip ci] [skip netlify]"
          git pull --rebase --autostash
          git push
