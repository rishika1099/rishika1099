name: Draw the contribution snake

# The snake on the profile README eats its way across the contribution graph.
# Once a day this redraws it from the latest graph, in GitHub's colours, which
# follow the visitor's light or dark mode on their own.
#
# The pictures are committed to main, in images/snake/, rather than kept on a
# branch of their own, so the repository stays a single branch. A day with no
# new contributions draws the same picture, and then nothing is committed.

on:
  schedule:
    - cron: "40 6 * * *" # daily, 06:40 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # A light copy and a dark one; the README shows whichever matches the
      # visitor's theme. It has to name them by their full raw address: given a
      # path inside the repo, GitHub never switched, and dark mode showed the
      # light copy, pale squares on a dark page.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rishika1099
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Commit if it changed
        run: |
          mkdir -p images/snake
          cp dist/snake.svg dist/snake-dark.svg images/snake/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/snake
          if git diff --cached --quiet; then
            echo "The snake is the same as yesterday's; nothing to commit."
            exit 0
          fi
          # [skip ci] and [skip netlify]: a new picture for the README is no
          # reason to rebuild the website
          git commit -m "Redraw the contribution snake [skip ci] [skip netlify]"
          git pull --rebase --autostash
          git push
