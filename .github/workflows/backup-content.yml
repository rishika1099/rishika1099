name: Back up site content

# Everything editable on the site lives only in Netlify Blobs: the poems, the
# guestbook, every page passage, the project overrides, the résumé source. This
# takes a weekly encrypted snapshot so none of it has a single point of failure.
#
# Encrypted because this repo is public and the poems are password-gated.
#
# Needs two repository secrets, and will tell you plainly if either is missing:
#   ADMIN_KEY           the same key the atelier uses, so the export endpoints answer
#   BACKUP_PASSPHRASE   what the snapshot is encrypted with. Keep it in a password
#                       manager too: without it the backup is unrecoverable.

on:
  schedule:
    - cron: "0 5 * * 0" # Sundays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Both secrets are checked before anything runs, because the failure that
      # actually happened was a missing ADMIN_KEY surfacing as an error from
      # inside the node script, several steps in and easy to misread as a bug in
      # the backup itself. A backup that stops backing up should say so in the
      # first line of the log.
      - name: Check the secrets are set
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -z "$ADMIN_KEY" ] && missing="$missing ADMIN_KEY"
          [ -z "$PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "Nothing was backed up. These repository secrets are not set:$missing"
            echo ""
            echo "Set them once, from a checkout of this repo:"
            for name in $missing; do echo "  gh secret set $name"; done
            echo ""
            echo "ADMIN_KEY is the atelier key. BACKUP_PASSPHRASE is yours to invent,"
            echo "and belongs in a password manager: it is the only way back in."
            exit 1
          fi
          echo "Both secrets present."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Collect the snapshot
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BACKUP_OUT: /tmp/portfolio-backup.json
        run: node scripts/backup-content.mjs

      - name: Encrypt it
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/portfolio-backup.json \
            -out backups/portfolio-backup.json.enc \
            -pass env:PASSPHRASE
          # never let the plaintext linger in the workspace
          shred -u /tmp/portfolio-backup.json 2>/dev/null || rm -f /tmp/portfolio-backup.json
          ls -lh backups/portfolio-backup.json.enc

      - name: Commit if it changed
        run: |
          if git diff --quiet -- backups/; then
            echo "Nothing changed since the last backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/portfolio-backup.json.enc
          git commit -m "Weekly encrypted content backup [skip ci]"
          # the readme sync bot commits to main too, so land on top of whatever
          # arrived while this ran rather than failing the whole backup on it
          git pull --rebase --autostash
          git push
