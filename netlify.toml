[build]
  base = "portfolio"
  command = "npm run build"
  publish = ".next"

# Netlify scans the build for secret values and failed the deploy because
# Turbopack's cache (.netlify/.next/cache/turbopack/*.sst) had ADMIN_API_TOKEN's
# value in it. The cache is Netlify's own build cache, kept between builds and
# never published; the deployed output has no copy of the token (checked by
# searching every built file for it). So the cache is exempt from the scan, and
# everything that actually ships is still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache,.next/cache"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Send the old netlify.app address to the real domain, so rishika-m.com is the
# one website (only matches the exact subdomain, not deploy-preview URLs).
[[redirects]]
  from = "https://rishika-m.netlify.app/*"
  to = "https://rishika-m.com/:splat"
  status = 301
  force = true
